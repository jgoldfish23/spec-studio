name: Deploy

# Every push to main (and a manual run) applies database migrations, then publishes the site to Cloudflare Pages.
# Secrets and variables are read by name from GitHub; nothing here prints them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A running deploy is never cancelled halfway; the next one waits.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check the database secret
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Migrations skipped: the SUPABASE_DB_URL secret is empty. Add it under Settings > Secrets and variables > Actions to apply database migrations."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.run == 'true'
      - name: Apply migrations
        if: steps.check.outputs.run == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Check the settings needed to deploy
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then echo "::error::The SUPABASE_URL variable is empty. Add it under Settings > Secrets and variables > Actions > Variables. Deploying without it would publish the demo build."; missing=1; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::The SUPABASE_ANON_KEY variable is empty. Add it under Settings > Secrets and variables > Actions > Variables. Deploying without it would publish the demo build."; missing=1; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The CLOUDFLARE_API_TOKEN secret is empty. Add it under Settings > Secrets and variables > Actions > Secrets."; missing=1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::The CLOUDFLARE_ACCOUNT_ID secret is empty. Add it under Settings > Secrets and variables > Actions > Secrets."; missing=1; fi
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the hosted site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Stops the deploy if a service-role key or database URL was pasted into a variable by mistake.
      - name: Check the build holds no secrets
        run: npm run check:bundle
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4.158.0 pages deploy dist --project-name=spec-studio --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
